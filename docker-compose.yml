services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 2s
      timeout: 5s
      retries: 30

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
      SQS_ENDPOINT_STRATEGY: domain
    volumes:
      - ./localstack/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sqs list-queues"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Opcional: a aplicação em container. Várias instâncias: docker compose up --scale app=3
  app:
    build: .
    profiles: ["app"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - "3000"
